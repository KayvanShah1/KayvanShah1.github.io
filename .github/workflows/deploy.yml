# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
    # Runs on pushes targeting the default branch
    push:
        branches: ["main"]

    # Allows you to run this workflow manually from the Actions tab
    workflow_dispatch:

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
    contents: read
    pages: write
    id-token: write

# Allow one concurrent deployment
concurrency:
    group: "pages"
    cancel-in-progress: false

jobs:
    build:
        environment:
            name: github-pages

        runs-on: ubuntu-latest

        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            VITE_WEB3FORMS_API_URL: ${{ secrets.VITE_WEB3FORMS_API_URL }}
            VITE_WEB3FORMS_API_KEY: ${{ secrets.VITE_WEB3FORMS_API_KEY }}

        steps:
            - name: Checkout
              uses: actions/checkout@v7.0.1

            - name: Set up Vite+
              uses: voidzero-dev/setup-vp@v1.22.0
              with:
                  node-version-file: ".node-version"
                  cache: true
                  run-install: false

            - name: Verify Node.js version
              run: |
                  node --input-type=module -e '
                    import assert from "node:assert/strict";
                    import { readFileSync } from "node:fs";
                    assert.equal(process.versions.node, readFileSync(".node-version", "utf8").trim());
                    console.log(`Node.js ${process.versions.node}`);
                  '

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Check
              run: pnpm run check

            - name: Build
              run: pnpm run build

            - name: Setup Pages
              uses: actions/configure-pages@v6.0.0

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v5.0.0
              with:
                  # Upload dist folder
                  path: "./dist"

    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        needs: build

        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v7.0.1

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v5.0.1
